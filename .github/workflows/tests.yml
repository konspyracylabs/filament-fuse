name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest

    # Only the dev-main Fuse leg is allowed to fail: it is an early warning for an
    # upstream reshape, not a claim about this package's own released support. Failing
    # it should not redden a PR that never touched Fuse at all.
    continue-on-error: ${{ matrix.fuse == 'dev-main' }}

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        laravel: ['11.*', '12.*', '13.*']
        # The released floor this package declares, plus the branch it will be
        # published against next. The dev-main leg is an early warning: it fails
        # here when upstream reshapes something, rather than in someone's panel
        # after the next tag.
        fuse: ['^0.10', 'dev-main']
        include:
          - laravel: '11.*'
            testbench: '9.*'
          - laravel: '12.*'
            testbench: '10.*'
          - laravel: '13.*'
            testbench: '11.*'

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / Fuse ${{ matrix.fuse }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml
          coverage: none

      # Laravel 11 is end-of-life and every tagged release carries security advisories
      # that will not be patched, so Composer 2.9+ refuses to resolve it from scratch.
      # Users are unaffected: an existing app installs this package as a partial update
      # that leaves its locked framework alone. This job resolves fresh, so it relaxes
      # the policy for the framework only — and thereby tests a real tagged 11.x, where
      # under minimum-stability=dev it used to slip onto the 11.x-dev branch unnoticed.
      - name: Allow Laravel 11 despite its unpatched advisories
        if: matrix.laravel == '11.*'
        run: composer config --json policy.advisories.ignore '["laravel/framework"]'

      - name: Pin the dependency versions for this matrix leg
        run: >
          composer require
          "laravel/framework:${{ matrix.laravel }}"
          "orchestra/testbench:${{ matrix.testbench }}"
          "harris21/laravel-fuse:${{ matrix.fuse }}"
          --no-interaction --no-update

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: ./vendor/bin/pest --no-coverage
