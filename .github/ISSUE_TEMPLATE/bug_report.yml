name: Bug report
description: Something the package does that it should not, or does not do that it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. The three version numbers and a few details about your
        circuit configuration answer most first questions, so a report that includes
        them gets fixed faster.

  - type: input
    id: version
    attributes:
      label: konspyracylabs/filament-fuse version
      placeholder: e.g. 0.1.1
    validations:
      required: true

  - type: input
    id: fuse
    attributes:
      label: harris21/laravel-fuse version
      placeholder: e.g. 0.10.0
    validations:
      required: true

  - type: input
    id: stack
    attributes:
      label: Filament / Laravel / PHP versions
      placeholder: e.g. Filament 5.7, Laravel 13.17, PHP 8.4
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Relevant configuration
      description: The `filament-fuse` and `fuse` config values that matter here (redact anything private).
      render: text

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you saw, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: How to reproduce it
      description: The smallest set of steps, or a failing test. Circuit config from `config/fuse.php` if relevant.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Where
      options:
        - Dashboard
        - Circuit detail page
        - Topbar indicator / navigation badge
        - Drills (filament-fuse:drill)
        - Install command / configuration
        - Something else
    validations:
      required: true
